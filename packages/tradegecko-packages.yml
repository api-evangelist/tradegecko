description: >-
  First-party TradeGecko client libraries verified against the public package
  registries. TradeGecko was acquired by Intuit in August 2020, rebranded as
  QuickBooks Commerce, and the standalone platform was subsequently
  discontinued; api.tradegecko.com no longer resolves (NXDOMAIN, checked
  2026-07-21). These libraries remain published on their registries but target
  a retired API. The tradegecko GitHub organization still exists but has no
  public repositories, so gem homepages pointing at github.com/tradegecko/*
  return 404.
