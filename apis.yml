name: Tradegecko
description: TradeGecko was a Singapore-based cloud inventory and order management platform
  for SMEs, wholesalers, and online retailers, launched in 2013 with integrations into
  Shopify, WooCommerce, and Xero. Intuit acquired TradeGecko in August 2020 and rebranded
  it QuickBooks Commerce; the standalone platform and its public REST API were subsequently
  discontinued. Its API hosts no longer resolve and tradegecko.com is no longer operated
  by the company, though first-party Ruby client libraries remain published on RubyGems.
